spring:
  application:
    name: event-service

  datasource:
    # Dev default: in-memory H2 in PostgreSQL compatibility mode.
    # Switch to PostgreSQL with env vars - no code change (docker compose sets these in MIV 3):
    #   DB_URL=jdbc:postgresql://event-postgres:5432/eventdb  DB_USER=event  DB_PASSWORD=event
    url: ${DB_URL:jdbc:h2:mem:eventdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

    # Tuned for Neon (serverless Postgres): keepalive stays under Neon's ~5 min
    # scale-to-zero window so Hikari's pooled connections don't go stale.
    # Pool sizes are modest - two dev services shouldn't hog connection slots.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      keepalive-time: 240000   # ms (4 min)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: 8081

app:
  # Shared secret between booking-service and event-service for service-to-service endpoints
  # (/reserve, /release). Same value must be set in both services.
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}

jwt:
  # Shared with booking-service (it issues the tokens, both validate them). Min 32 bytes.
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-min-32-bytes!!}
